# Balanceador local: reparte HTTP y WebSocket entre las 2 réplicas (sin afinidad de sesión,
# para demostrar que cualquier réplica puede atender cualquier partida).
events {}
http {
  upstream game { server server-1:8080; server server-2:8080; }
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080;
    location / {
      proxy_pass http://game;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
    }
  }
}
