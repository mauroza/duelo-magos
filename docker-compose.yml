# Ambiente local completo: 2 réplicas del servidor detrás de nginx, PostgreSQL y Redis.
#   docker compose up --build      ->  http://localhost:8080  (cliente en /play, API en /docs)
# Las credenciales de aquí son SOLO para desarrollo local; en Azure no hay contraseñas (identidad administrada).
x-env: &env
  NODE_ENV: development
  AUTH_MODE: local
  DATABASE_URL: postgres://duelo:duelo-local-dev@postgres:5432/duelo
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:-desarrollo-local-no-usar-en-produccion-0123456789}
  ALLOWED_ORIGINS: http://localhost:8080
  LOG_LEVEL: ${LOG_LEVEL:-info}
  BROADCAST_MODE: ${BROADCAST_MODE:-delta}
  RATE_LIMIT_HTTP_PER_MIN: ${RATE_LIMIT_HTTP_PER_MIN:-120}
  RATE_LIMIT_AUTH_PER_MIN: ${RATE_LIMIT_AUTH_PER_MIN:-10}
  WS_MAX_CONN_PER_USER: ${WS_MAX_CONN_PER_USER:-3}

x-server: &server
  build: .
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  server-1:
    <<: *server
    environment: { <<: *env, INSTANCE_ID: server-1 }
  server-2:
    <<: *server
    environment: { <<: *env, INSTANCE_ID: server-2 }

  lb:
    image: nginx:1.27-alpine
    ports: ["8080:8080"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [server-1, server-2]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: duelo
      POSTGRES_USER: duelo
      POSTGRES_PASSWORD: duelo-local-dev
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duelo -d duelo"]
      interval: 2s
      retries: 30
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
